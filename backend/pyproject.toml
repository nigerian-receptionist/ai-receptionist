[project]
name = "ai-receptionist-backend"
version = "0.1.0"
description = "FastAPI service for the AI receptionist platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "redis>=5,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["ruff==0.16.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

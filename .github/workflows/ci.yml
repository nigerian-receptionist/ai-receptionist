name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install "pre-commit==4.2.0"
      - name: Run repository hooks
        run: pre-commit run --all-files
      - name: Check Python syntax
        run: python -m compileall -q voice-lab/src voice-lab/scripts

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_receptionist
          POSTGRES_USER: ai_receptionist
          POSTGRES_PASSWORD: change-me-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_receptionist -d ai_receptionist"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Migrate and seed
        run: pnpm db:setup
        env:
          DATABASE_MIGRATION_URL: postgresql://ai_receptionist:change-me-local-only@127.0.0.1:5432/ai_receptionist
          DEV_TENANT_ID: 0195f3a0-0000-7000-8000-000000000001
      - name: Integration and leak tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://ai_receptionist_app:change-me-app-local-only@127.0.0.1:5432/ai_receptionist
          DATABASE_MIGRATION_URL: postgresql://ai_receptionist:change-me-local-only@127.0.0.1:5432/ai_receptionist

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

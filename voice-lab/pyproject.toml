[project]
name = "ai-receptionist-voice-lab"
version = "0.1.0"
description = "Offline Nigerian speech model experiments and benchmarks"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff==0.16.8"]
speech = [
  "openai-whisper==20250625",
  "jiwer>=4,<5",
  "pyyaml>=6.0.3,<7",
  "torch>=2.14.1,<3",
]
tts = ["kokoro-onnx>=0.3.8,<1"]
live = [
  "litellm>=1.74.7,<2",
  "silero-vad>=6.2.3,<7",
  "sounddevice>=0.5.2,<1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicelab"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
